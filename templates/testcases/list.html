{% extends "base.html" %}

{% block page_title %}用例管理{% endblock %}

{% block page_actions %}
<div class="btn-group">
    <button type="button" class="btn btn-outline-primary" id="batchDataBtn" disabled>
        <i class="bi bi-image me-1"></i> 批量设置测试数据
    </button>
    <button type="button" class="btn btn-outline-info" id="selectImagesBtn" disabled>
        <i class="bi bi-magic me-1"></i> 智能分配测试数据
    </button>
</div>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- 搜索和筛选 -->
    <div class="row mb-3">
        <div class="col-md-8">
            <div class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="搜索用例...">
                <button class="btn btn-outline-secondary" type="button" id="searchBtn">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <select class="form-select" id="statusFilter">
                <option value="">所有状态</option>
                <option value="pending">待执行</option>
                <option value="executing">执行中</option>
                <option value="passed">通过</option>
                <option value="failed">失败</option>
            </select>
        </div>
    </div>

    <!-- 用例列表 -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th width="40px">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="selectAllCases">
                                </div>
                            </th>
                            <th>ID</th>
                            <th>名称</th>
                            <th>测试目的</th>
                            <th>测试数据</th>
                            <th>状态</th>
                            <th>所属任务</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="testCasesTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4">
                                <div class="spinner-border spinner-border-sm text-secondary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                                <span class="ms-2">加载测试用例...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 批量设置测试数据模态框 -->
<div class="modal fade" id="batchDataModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量设置测试数据</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="batchDataForm">
                    <div class="mb-3">
                        <label for="testDataPath" class="form-label">测试数据路径</label>
                        <input type="text" class="form-control" id="testDataPath" required>
                        <div class="form-text">请输入测试数据文件路径，例如：test_image.jpg</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmBatchData">确认设置</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑用例模态框 -->
<div class="modal fade" id="editCaseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑测试用例</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editCaseForm">
                    <input type="hidden" id="editCaseId">
                    <div class="mb-3">
                        <label for="editCaseName" class="form-label">用例名称</label>
                        <input type="text" class="form-control" id="editCaseName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editCasePurpose" class="form-label">测试目的</label>
                        <textarea class="form-control" id="editCasePurpose" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editCaseData" class="form-label">测试数据</label>
                        <input type="text" class="form-control" id="editCaseData">
                        <div class="form-text">输入测试数据文件路径</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveCase()">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let selectedCases = new Set();
    let testCases = [];
    let batchDataModal = null;
    let editCaseModal = null;
    
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化模态框
        batchDataModal = new bootstrap.Modal(document.getElementById('batchDataModal'));
        editCaseModal = new bootstrap.Modal(document.getElementById('editCaseModal'));
        
        // 加载测试用例
        loadTestCases();
        
        // 绑定搜索事件
        document.getElementById('searchBtn').addEventListener('click', filterTestCases);
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') filterTestCases();
        });
        
        // 绑定状态筛选事件
        document.getElementById('statusFilter').addEventListener('change', filterTestCases);
        
        // 绑定全选事件
        document.getElementById('selectAllCases').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.case-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = this.checked;
                toggleCaseSelection(cb.value, cb.checked);
            });
            updateBatchButtons();
        });
        
        // 绑定批量设置测试数据按钮事件
        document.getElementById('batchDataBtn').addEventListener('click', function() {
            if (selectedCases.size > 0) {
                batchDataModal.show();
            }
        });
        
        // 绑定确认批量设置事件
        document.getElementById('confirmBatchData').addEventListener('click', function() {
            const testDataPath = document.getElementById('testDataPath').value.trim();
            if (!testDataPath) {
                showNotification('warning', '请输入测试数据路径');
                return;
            }
            
            batchDataModal.hide();
            
            fetch('/api/testcases/batch-set-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    case_ids: Array.from(selectedCases),
                    test_data: testDataPath
                })
            })
            .then(response => response.json())
            .then(data => {
                showNotification('success', '测试数据设置成功');
                document.getElementById('testDataPath').value = '';
                loadTestCases();
            })
            .catch(error => {
                console.error('设置测试数据失败:', error);
                showNotification('danger', `设置测试数据失败: ${error.message}`);
            });
        });
        
        // 绑定智能分配测试数据按钮事件
        document.getElementById('selectImagesBtn').addEventListener('click', function() {
            if (selectedCases.size === 0) {
                showNotification('warning', '请先选择测试用例');
                return;
            }
            
            if (!confirm('确定要智能分配测试数据吗？这将根据任务的数据集自动为所有测试用例分配合适的图片。')) {
                return;
            }
            
            const btn = this;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> 处理中...';
            
            showNotification('info', '正在分配测试数据，请稍候...');
            
            fetch('/api/testcases/smart-assign-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    case_ids: Array.from(selectedCases)
                })
            })
            .then(response => response.json())
            .then(data => {
                showNotification('success', '测试数据分配成功');
                loadTestCases();
            })
            .catch(error => {
                console.error('分配测试数据失败:', error);
                showNotification('danger', `分配测试数据失败: ${error.message}`);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = originalText;
            });
        });
    });
    
    function loadTestCases() {
        fetch('/api/testcases')
            .then(response => response.json())
            .then(data => {
                testCases = data.test_cases || [];
                renderTestCases(testCases);
            })
            .catch(error => {
                console.error('获取测试用例失败:', error);
                showNotification('danger', `获取测试用例失败: ${error.message}`);
            });
    }
    
    function renderTestCases(casesToRender) {
        const tbody = document.getElementById('testCasesTableBody');
        tbody.innerHTML = '';
        
        if (casesToRender.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center py-4">
                        <i class="bi bi-inbox text-muted"></i>
                        <span class="ms-2">暂无测试用例</span>
                    </td>
                </tr>
            `;
            return;
        }
        
        casesToRender.forEach(testCase => {
            const statusClass = {
                'pending': 'secondary',
                'executing': 'primary',
                'passed': 'success',
                'failed': 'danger'
            }[testCase.status] || 'secondary';
            
            tbody.innerHTML += `
                <tr>
                    <td>
                        <div class="form-check">
                            <input class="form-check-input case-checkbox" type="checkbox" 
                                   value="${testCase.case_id}"
                                   ${selectedCases.has(testCase.case_id) ? 'checked' : ''}>
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark">
                            ${testCase.case_id.substring(0, 8)}
                        </span>
                    </td>
                    <td>${testCase.name || '未命名测试用例'}</td>
                    <td>${testCase.purpose || '-'}</td>
                    <td>
                        <small class="text-muted">
                            ${testCase.test_data || '未设置'}
                        </small>
                    </td>
                    <td>
                        <span class="badge bg-${statusClass}">
                            ${getStatusText(testCase.status)}
                        </span>
                    </td>
                    <td>
                        <a href="/tasks/${testCase.task_id}" class="text-decoration-none">
                            ${testCase.task_id.substring(0, 8)}
                        </a>
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-primary" 
                                    onclick="editCase('${testCase.case_id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="btn btn-outline-danger" 
                                    onclick="deleteCase('${testCase.case_id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        
        // 绑定复选框事件
        document.querySelectorAll('.case-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                toggleCaseSelection(this.value, this.checked);
                updateBatchButtons();
            });
        });
    }
    
    function filterTestCases() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const status = document.getElementById('statusFilter').value;
        
        const filteredCases = testCases.filter(testCase => {
            const matchesKeyword = !keyword || 
                testCase.case_id.toLowerCase().includes(keyword) ||
                (testCase.name && testCase.name.toLowerCase().includes(keyword)) ||
                (testCase.purpose && testCase.purpose.toLowerCase().includes(keyword));
                
            const matchesStatus = !status || testCase.status === status;
            
            return matchesKeyword && matchesStatus;
        });
        
        renderTestCases(filteredCases);
    }
    
    function toggleCaseSelection(caseId, isSelected) {
        if (isSelected) {
            selectedCases.add(caseId);
        } else {
            selectedCases.delete(caseId);
        }
    }
    
    function updateBatchButtons() {
        const batchDataBtn = document.getElementById('batchDataBtn');
        const selectImagesBtn = document.getElementById('selectImagesBtn');
        
        batchDataBtn.disabled = selectedCases.size === 0;
        selectImagesBtn.disabled = selectedCases.size === 0;
    }
    
    function editCase(caseId) {
        const testCase = testCases.find(c => c.case_id === caseId);
        if (!testCase) return;
        
        document.getElementById('editCaseId').value = caseId;
        document.getElementById('editCaseName').value = testCase.name || '';
        document.getElementById('editCasePurpose').value = testCase.purpose || '';
        document.getElementById('editCaseData').value = testCase.test_data || '';
        
        editCaseModal.show();
    }
    
    function saveCase() {
        const caseId = document.getElementById('editCaseId').value;
        const name = document.getElementById('editCaseName').value.trim();
        const purpose = document.getElementById('editCasePurpose').value.trim();
        const testData = document.getElementById('editCaseData').value.trim();
        
        if (!name) {
            showNotification('warning', '请输入用例名称');
            return;
        }
        
        fetch(`/api/testcases/${caseId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: name,
                purpose: purpose,
                test_data: testData
            })
        })
        .then(response => response.json())
        .then(data => {
            editCaseModal.hide();
            showNotification('success', '测试用例已更新');
            loadTestCases();
        })
        .catch(error => {
            console.error('更新测试用例失败:', error);
            showNotification('danger', `更新测试用例失败: ${error.message}`);
        });
    }
    
    function deleteCase(caseId) {
        if (!confirm('确定要删除这个测试用例吗？此操作不可恢复。')) return;
        
        fetch(`/api/testcases/${caseId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            showNotification('success', '测试用例已删除');
            loadTestCases();
        })
        .catch(error => {
            console.error('删除测试用例失败:', error);
            showNotification('danger', `删除测试用例失败: ${error.message}`);
        });
    }
    
    function getStatusText(status) {
        const statusMap = {
            'pending': '待执行',
            'executing': '执行中',
            'passed': '通过',
            'failed': '失败'
        };
        return statusMap[status] || status;
    }
    
    function showNotification(type, message) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
        alertDiv.style.zIndex = '9999';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        document.body.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.classList.remove('show');
            setTimeout(() => alertDiv.remove(), 300);
        }, 3000);
    }
</script>
{% endblock %}
