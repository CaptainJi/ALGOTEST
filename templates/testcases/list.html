{% extends "base.html" %}

{% block page_title %}测试用例管理{% endblock %}

{% block page_actions %}
<div class="btn-group">
    {% if document_id %}
    <a href="/documents/{{ document_id }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> 返回文档
    </a>
    {% endif %}
    <a href="/testcases/create{% if document_id %}?document_id={{ document_id }}{% endif %}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> 创建测试用例
    </a>
    <button id="batchConfigImageBtn" class="btn btn-success" disabled>
        <i class="bi bi-images"></i> 批量配置测试图片
    </button>
</div>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div id="testCasesContainer">
                        <div class="text-center my-4">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2">加载测试用例...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 批量配置测试图片的弹窗 -->
<div class="modal fade" id="configImageModal" tabindex="-1" aria-labelledby="configImageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="configImageModalLabel">批量配置测试图片</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>已选择 <span id="selectedCasesCount">0</span> 个测试用例
                </div>
                <form id="batchImageForm">
                    <div class="mb-3">
                        <label for="taskIdSelect" class="form-label">选择任务</label>
                        <select class="form-select" id="taskIdSelect" required>
                            <option value="" selected disabled>请选择任务</option>
                            <!-- 任务列表将通过 JavaScript 加载 -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="imagePathInput" class="form-label">测试图片路径</label>
                        <input type="text" class="form-control" id="imagePathInput" placeholder="请输入图片路径，如：/data/images/test.jpg" required>
                        <div class="form-text">请输入有效的图片路径，支持相对路径或绝对路径</div>
                    </div>
                </form>
                <div id="configImageError" class="alert alert-danger d-none"></div>
                <div id="configImageSuccess" class="alert alert-success d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveConfigBtn">保存配置</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const documentId = '{{ document_id or "" }}';
    let selectedTestCases = [];
    let allTestCases = [];
    
    document.addEventListener('DOMContentLoaded', function() {
        loadTestCases();
        loadTasks();
        
        // 批量配置测试图片按钮点击事件
        document.getElementById('batchConfigImageBtn').addEventListener('click', function() {
            if (selectedTestCases.length > 0) {
                document.getElementById('selectedCasesCount').textContent = selectedTestCases.length;
                document.getElementById('configImageError').classList.add('d-none');
                document.getElementById('configImageSuccess').classList.add('d-none');
                
                // 显示配置弹窗
                const configImageModal = new bootstrap.Modal(document.getElementById('configImageModal'));
                configImageModal.show();
            }
        });
        
        // 保存配置按钮点击事件
        document.getElementById('saveConfigBtn').addEventListener('click', saveImageConfig);
    });
    
    function loadTestCases() {
        const url = documentId ? `/api/testcases?document_id=${documentId}` : '/api/testcases';
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                allTestCases = data.test_cases || [];
                renderTestCases(allTestCases);
            })
            .catch(error => {
                console.error('获取测试用例失败:', error);
                showError(document.getElementById('testCasesContainer'), '加载测试用例失败，请刷新重试');
            });
    }
    
    function loadTasks() {
        fetch('/api/tasks')
            .then(response => response.json())
            .then(data => {
                const taskIdSelect = document.getElementById('taskIdSelect');
                const tasks = data.tasks || [];
                
                if (tasks.length === 0) {
                    taskIdSelect.innerHTML = '<option value="" disabled>暂无任务</option>';
                    return;
                }
                
                taskIdSelect.innerHTML = '<option value="" selected disabled>请选择任务</option>';
                tasks.forEach(task => {
                    const option = document.createElement('option');
                    option.value = task.id;
                    option.textContent = `${task.name} (${task.id})`;
                    taskIdSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('获取任务列表失败:', error);
                document.getElementById('taskIdSelect').innerHTML = 
                    '<option value="" disabled>加载任务失败</option>';
            });
    }
    
    function renderTestCases(testCases) {
        const container = document.getElementById('testCasesContainer');
        
        if (testCases.length === 0) {
            container.innerHTML = `
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>没有测试用例，可点击"创建测试用例"按钮添加。
                </div>
            `;
            return;
        }
        
        container.innerHTML = `
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th style="width: 5%;">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="selectAllCases">
                                </div>
                            </th>
                            <th style="width: 15%;">ID</th>
                            <th style="width: 20%;">名称</th>
                            <th style="width: 30%;">测试目的</th>
                            <th style="width: 15%;">状态</th>
                            <th style="width: 15%;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${testCases.map(testCase => `
                            <tr>
                                <td>
                                    <div class="form-check">
                                        <input class="form-check-input case-checkbox" type="checkbox" 
                                            data-id="${testCase.id}" 
                                            data-name="${testCase.name}" 
                                            id="case-${testCase.id}">
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark">${testCase.id}</span>
                                </td>
                                <td>${testCase.name}</td>
                                <td>${truncateText(testCase.purpose, 50)}</td>
                                <td>
                                    <span class="badge ${getCaseStatusBadge(testCase.status)}">
                                        ${getCaseStatusText(testCase.status)}
                                    </span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a href="/testcases/${testCase.id}" class="btn btn-outline-primary">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a href="/testcases/${testCase.id}/edit" class="btn btn-outline-secondary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        
        // 添加全选/取消全选功能
        const selectAllCheckbox = document.getElementById('selectAllCases');
        const caseCheckboxes = document.querySelectorAll('.case-checkbox');
        
        selectAllCheckbox.addEventListener('change', function() {
            const isChecked = this.checked;
            caseCheckboxes.forEach(checkbox => {
                checkbox.checked = isChecked;
            });
            updateSelectedCases();
        });
        
        // 添加单个复选框选择事件
        caseCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                updateSelectedCases();
                
                // 检查是否所有复选框都被选中
                const allChecked = Array.from(caseCheckboxes).every(cb => cb.checked);
                selectAllCheckbox.checked = allChecked;
            });
        });
    }
    
    function updateSelectedCases() {
        selectedTestCases = [];
        const caseCheckboxes = document.querySelectorAll('.case-checkbox:checked');
        
        caseCheckboxes.forEach(checkbox => {
            selectedTestCases.push({
                id: checkbox.dataset.id,
                name: checkbox.dataset.name
            });
        });
        
        // 更新批量配置按钮状态
        const batchConfigBtn = document.getElementById('batchConfigImageBtn');
        batchConfigBtn.disabled = selectedTestCases.length === 0;
    }
    
    function saveImageConfig() {
        const taskId = document.getElementById('taskIdSelect').value;
        const imagePath = document.getElementById('imagePathInput').value.trim();
        const errorDiv = document.getElementById('configImageError');
        const successDiv = document.getElementById('configImageSuccess');
        
        // 重置提示信息
        errorDiv.classList.add('d-none');
        successDiv.classList.add('d-none');
        
        // 验证输入
        if (!taskId) {
            errorDiv.textContent = '请选择任务';
            errorDiv.classList.remove('d-none');
            return;
        }
        
        if (!imagePath) {
            errorDiv.textContent = '请输入测试图片路径';
            errorDiv.classList.remove('d-none');
            return;
        }
        
        // 准备请求数据
        const updateData = {
            test_cases: selectedTestCases.map(testCase => ({
                case_id: testCase.id,
                test_data: imagePath
            }))
        };
        
        // 发送更新请求
        fetch(`/api/tasks/${taskId}/test-data`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(updateData)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('服务器响应错误');
            }
            return response.json();
        })
        .then(data => {
            // 更新成功
            successDiv.textContent = `成功配置了 ${selectedTestCases.length} 个测试用例的测试图片`;
            successDiv.classList.remove('d-none');
            
            // 3秒后关闭弹窗
            setTimeout(() => {
                const modal = bootstrap.Modal.getInstance(document.getElementById('configImageModal'));
                if (modal) {
                    modal.hide();
                }
            }, 3000);
        })
        .catch(error => {
            // 更新失败
            console.error('配置测试图片失败:', error);
            errorDiv.textContent = '配置测试图片失败：' + error.message;
            errorDiv.classList.remove('d-none');
        });
    }
    
    function getCaseStatusBadge(status) {
        const statusMap = {
            'pending': 'bg-secondary',
            'executing': 'bg-primary',
            'passed': 'bg-success',
            'failed': 'bg-danger'
        };
        return statusMap[status] || 'bg-secondary';
    }
    
    function getCaseStatusText(status) {
        const statusMap = {
            'pending': '待执行',
            'executing': '执行中',
            'passed': '通过',
            'failed': '失败'
        };
        return statusMap[status] || status;
    }
    
    function truncateText(text, maxLength) {
        if (!text) return '';
        return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
    }
    
    function showError(container, message) {
        container.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>${message}
            </div>
        `;
    }
</script>
{% endblock %}
