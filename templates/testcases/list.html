{% extends "base.html" %}

{% block page_title %}测试用例管理{% endblock %}

{% block page_actions %}
<div class="btn-group" id="testCasesActions">
    {% if document_id %}
    <a href="/documents/{{ document_id }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> 返回文档
    </a>
    {% endif %}
    <a href="/testcases/create{% if document_id %}?document_id={{ document_id }}{% endif %}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i> 创建测试用例
    </a>
    <button id="batchDataBtn" class="btn btn-outline-primary" disabled>
        <i class="bi bi-image me-1"></i> 批量设置测试数据
    </button>
    <button id="selectImagesBtn" class="btn btn-outline-info" style="display:none;">
        <i class="bi bi-magic me-1"></i> 智能分配测试数据
    </button>
</div>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div id="testCasesContainer">
                        <div class="text-center my-4">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2">加载测试用例...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 批量设置测试数据模态框 -->
<div class="modal fade" id="batchDataModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量设置测试数据</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="batchDataForm">
                    <div class="mb-3">
                        <label for="testDataPath" class="form-label">测试数据路径</label>
                        <input type="text" class="form-control" id="testDataPath" required>
                        <div class="form-text">请输入测试数据文件路径，例如：test_image.jpg</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmBatchData">确认设置</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const documentId = '{{ document_id }}';
    let taskId = null;
    let selectedCases = new Set();
    let batchDataModal = null;
    
    document.addEventListener('DOMContentLoaded', function() {
        loadTestCases();
        
        // 初始化模态框
        batchDataModal = new bootstrap.Modal(document.getElementById('batchDataModal'));
        
        // 添加批量设置测试数据按钮点击事件
        document.getElementById('batchDataBtn').addEventListener('click', function() {
            if (selectedCases.size > 0) {
                window.location.href = `/testcases/batch-data?cases=${Array.from(selectedCases).join(',')}`;
            }
        });
        
        // 添加智能分配测试数据按钮点击事件
        document.getElementById('selectImagesBtn').addEventListener('click', function() {
            if (taskId) {
                selectImages(taskId);
            } else {
                showNotification('warning', '无法确定关联的任务ID，请先获取任务ID');
                getTaskIdForDocument();
            }
        });
    });
    
    function loadTestCases() {
        const url = '/api/tasks';
        console.log('开始加载测试用例...');
        showLoading();
        
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                console.log('成功获取任务列表');
                return response.json();
            })
            .then(data => {
                console.log('任务数据:', data);
                const tasks = data.tasks || [];
                if (tasks.length === 0) {
                    hideLoading();
                    document.getElementById('testCasesContainer').innerHTML = `
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>没有测试用例，可点击"创建测试用例"按钮添加。
                        </div>
                    `;
                    return;
                }
                
                // 获取每个任务的测试用例
                Promise.all(tasks.map(task => {
                    console.log(`获取任务 ${task.task_id} 的测试用例`);
                    return fetch(`/api/tasks/${task.task_id}/test-data`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`获取任务 ${task.task_id} 的测试用例失败: ${response.status}`);
                            }
                            return response.json();
                        })
                        .then(caseData => ({
                            task: task,
                            testCases: caseData.test_cases || []
                        }))
                        .catch(error => {
                            console.error(`获取任务 ${task.task_id} 的测试用例失败:`, error);
                            return {
                                task: task,
                                testCases: [],
                                error: error.message
                            };
                        });
                }))
                .then(tasksWithCases => {
                    console.log('所有任务的测试用例数据:', tasksWithCases);
                    hideLoading();
                    
                    if (tasksWithCases.some(t => t.error)) {
                        const errors = tasksWithCases
                            .filter(t => t.error)
                            .map(t => `任务 ${t.task.task_id}: ${t.error}`)
                            .join('\n');
                        showNotification('warning', `部分任务的测试用例加载失败:\n${errors}`);
                    }
                    
                    renderTasksAndCases(tasksWithCases);
                })
                .catch(error => {
                    console.error('获取测试用例数据失败:', error);
                    hideLoading();
                    showError(document.getElementById('testCasesContainer'), `加载测试用例数据失败: ${error.message}`);
                });
            })
            .catch(error => {
                console.error('获取任务列表失败:', error);
                hideLoading();
                showError(document.getElementById('testCasesContainer'), `加载任务列表失败: ${error.message}`);
            });
    }
    
    function renderTasksAndCases(tasksWithCases) {
        console.log('开始渲染任务和测试用例:', tasksWithCases);
        const container = document.getElementById('testCasesContainer');
        
        if (!tasksWithCases || tasksWithCases.length === 0) {
            console.log('没有任务或测试用例数据');
            container.innerHTML = `
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>没有测试用例，可点击"创建测试用例"按钮添加。
                </div>
            `;
            return;
        }
        
        container.innerHTML = `
            <div class="accordion" id="tasksAccordion">
                ${tasksWithCases.map((taskData, index) => {
                    console.log(`渲染任务 ${index + 1}/${tasksWithCases.length}:`, taskData);
                    return `
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" type="button" 
                                        data-bs-toggle="collapse" data-bs-target="#task-${taskData.task.task_id}">
                                    <div class="d-flex align-items-center justify-content-between w-100 me-3">
                                        <div>
                                            <span class="badge bg-secondary me-2">${taskData.task.task_id}</span>
                                            <span class="badge bg-${getTaskStatusBadge(taskData.task.status)}">${taskData.task.status}</span>
                                        </div>
                                        <div class="ms-3">
                                            <small class="text-muted">测试用例: ${taskData.testCases.length}</small>
                                        </div>
                                    </div>
                                </button>
                            </h2>
                            <div id="task-${taskData.task.task_id}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}"
                                 data-bs-parent="#tasksAccordion">
                                <div class="accordion-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover mb-0">
                                            <thead>
                                                <tr>
                                                    <th style="width: 5%;"><input type="checkbox" class="task-select-all" 
                                                        data-task-id="${taskData.task.task_id}"></th>
                                                    <th style="width: 15%;">ID</th>
                                                    <th style="width: 20%;">名称</th>
                                                    <th style="width: 30%;">测试目的</th>
                                                    <th style="width: 15%;">状态</th>
                                                    <th style="width: 15%;">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${taskData.testCases.map(testCase => {
                                                    console.log('渲染测试用例:', testCase);
                                                    return `
                                                        <tr>
                                                            <td>
                                                                <input type="checkbox" class="case-checkbox" 
                                                                       data-task-id="${taskData.task.task_id}"
                                                                       data-case-id="${testCase.case_id}">
                                                            </td>
                                                            <td>
                                                                <span class="badge bg-light text-dark">${testCase.case_id}</span>
                                                            </td>
                                                            <td>${testCase.name || '未命名测试用例'}</td>
                                                            <td>${truncateText(testCase.purpose, 50)}</td>
                                                            <td>
                                                                <span class="badge ${getCaseStatusBadge(testCase.status)}">
                                                                    ${getCaseStatusText(testCase.status, testCase.is_passed)}
                                                                </span>
                                                            </td>
                                                            <td>
                                                                <div class="btn-group btn-group-sm">
                                                                    <a href="/testcases/${testCase.case_id}" class="btn btn-outline-primary">
                                                                        <i class="bi bi-eye"></i>
                                                                    </a>
                                                                    <a href="/testcases/${testCase.case_id}/edit" class="btn btn-outline-secondary">
                                                                        <i class="bi bi-pencil"></i>
                                                                    </a>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    `;
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
        
        console.log('完成渲染任务和测试用例');
        
        // 绑定事件处理器
        bindEventHandlers();
    }
    
    function bindEventHandlers() {
        console.log('开始绑定事件处理器');
        
        // 绑定任务级别的全选/取消全选事件
        document.querySelectorAll('.task-select-all').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const taskId = this.dataset.taskId;
                console.log(`任务 ${taskId} 的全选框状态改变:`, this.checked);
                
                const taskCheckboxes = document.querySelectorAll(`.case-checkbox[data-task-id="${taskId}"]`);
                taskCheckboxes.forEach(caseCheckbox => {
                    caseCheckbox.checked = this.checked;
                    const caseId = caseCheckbox.dataset.caseId;
                    if (this.checked) {
                        selectedCases.add(caseId);
                    } else {
                        selectedCases.delete(caseId);
                    }
                });
                updateBatchDataButton();
            });
        });
        
        // 绑定单个测试用例复选框事件
        document.querySelectorAll('.case-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const caseId = this.dataset.caseId;
                const taskId = this.dataset.taskId;
                console.log(`测试用例 ${caseId} 的复选框状态改变:`, this.checked);
                
                if (this.checked) {
                    selectedCases.add(caseId);
                } else {
                    selectedCases.delete(caseId);
                }
                
                // 更新任务级别的全选框状态
                const taskCheckboxes = document.querySelectorAll(`.case-checkbox[data-task-id="${taskId}"]`);
                const taskSelectAll = document.querySelector(`.task-select-all[data-task-id="${taskId}"]`);
                const allChecked = Array.from(taskCheckboxes).every(cb => cb.checked);
                const someChecked = Array.from(taskCheckboxes).some(cb => cb.checked);
                taskSelectAll.checked = allChecked;
                taskSelectAll.indeterminate = someChecked && !allChecked;
                
                updateBatchDataButton();
            });
        });
        
        console.log('事件处理器绑定完成');
    }
    
    function updateBatchDataButton() {
        const batchDataBtn = document.getElementById('batchDataBtn');
        batchDataBtn.disabled = selectedCases.size === 0;
    }
    
    function getTaskStatusBadge(status) {
        const statusMap = {
            'created': 'info',
            'pending': 'warning',
            'running': 'primary',
            'completed': 'success',
            'failed': 'danger'
        };
        return statusMap[status] || 'secondary';
    }
    
    function getCaseStatusBadge(status) {
        switch (status) {
            case 'pending':
                return 'bg-secondary';
            case 'running':
                return 'bg-primary';
            case 'completed':
                return 'bg-success';
            case 'failed':
                return 'bg-danger';
            default:
                return 'bg-secondary';
        }
    }
    
    function getCaseStatusText(status, is_passed) {
        switch (status) {
            case 'pending':
                return '待执行';
            case 'running':
                return '执行中';
            case 'completed':
                return is_passed ? '测试通过' : '测试失败';
            case 'failed':
                return '执行失败';
            default:
                return '待执行';
        }
    }
    
    function truncateText(text, maxLength) {
        if (!text) return '';
        return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
    }
    
    // 获取文档对应的任务ID
    function getTaskIdForDocument() {
        if (!documentId) {
            showNotification('warning', '无法获取关联的任务ID，未指定文档ID');
            return;
        }
        
        fetch(`/api/tasks?document_id=${documentId}`)
            .then(response => response.json())
            .then(data => {
                if (data && data.tasks && data.tasks.length > 0) {
                    taskId = data.tasks[0].task_id;
                    showNotification('success', `已获取任务ID: ${taskId}`);
                    document.getElementById('selectImagesBtn').style.display = 'inline-block';
                } else {
                    showNotification('warning', '未找到与文档关联的任务');
                }
            })
            .catch(error => {
                console.error('获取任务ID失败:', error);
                showNotification('danger', `获取任务ID失败: ${error.message}`);
            });
    }
    
    // 智能分配测试数据
    function selectImages(taskId) {
        if (!confirm('确定要智能分配测试数据吗？这将根据任务的数据集自动为测试用例分配合适的图片。')) {
            return;
        }
        
        // 显示加载状态
        showNotification('info', '<i class="bi bi-hourglass-split me-2"></i>正在分配测试数据，请稍候...');
        
        // 发送API请求
        fetch(`/api/tasks/${taskId}/select-images`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({})
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('智能分配测试数据结果:', data);
            
            if (data.success) {
                // 成功分配测试数据
                let examplesHtml = '';
                if (data.image_examples && data.image_examples.length > 0) {
                    examplesHtml = '<ul class="mt-2 mb-0">' + 
                        data.image_examples.map(([caseId, imagePath]) => 
                            `<li><small>${caseId.substring(0, 8)}... => ${imagePath}</small></li>`
                        ).join('') + 
                    '</ul>';
                }
                
                showNotification('success', `
                    <div>
                        <div><i class="bi bi-check-circle me-2"></i>成功为 ${data.updated_count} 个测试用例分配测试数据！</div>
                        ${examplesHtml}
                    </div>
                `);
                
                // 2秒后刷新页面
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                // 分配失败
                let errorsHtml = '';
                if (data.errors && data.errors.length > 0) {
                    errorsHtml = '<ul class="mt-2 mb-0">' + 
                        data.errors.map(err => `<li><small>${err}</small></li>`).join('') + 
                    '</ul>';
                }
                
                showNotification('danger', `
                    <div>
                        <div><i class="bi bi-exclamation-triangle me-2"></i>分配测试数据失败：${data.message}</div>
                        ${errorsHtml}
                    </div>
                `);
            }
        })
        .catch(error => {
            console.error('智能分配测试数据失败:', error);
            showNotification('danger', `智能分配测试数据失败: ${error.message}`);
        });
    }
    
    // 显示通知消息
    function showNotification(type, message) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        
        // 在页面顶部显示通知
        const container = document.querySelector('.container');
        container.insertBefore(alertDiv, container.firstChild);
        
        // 自动关闭通知
        setTimeout(() => {
            alertDiv.classList.remove('show');
            setTimeout(() => alertDiv.remove(), 300);
        }, 5000);
    }
    
    // 显示错误消息
    function showError(container, message) {
        container.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle me-2"></i> ${message}
            </div>
        `;
    }

    function showLoading() {
        document.getElementById('testCasesContainer').innerHTML = `
            <div class="text-center my-4">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2">加载测试用例...</p>
            </div>
        `;
    }

    function hideLoading() {
        // 不需要做任何事情，因为内容会被新的内容替换
    }
</script>
{% endblock %}
