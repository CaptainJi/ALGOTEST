{% extends "base.html" %}

{% block page_title %}用例管理{% endblock %}

{% block page_actions %}
<div class="btn-group">
    <button type="button" class="btn btn-outline-primary" id="batchDataBtn" disabled>
        <i class="bi bi-image me-1"></i> 批量设置测试数据
    </button>
    <button type="button" class="btn btn-outline-info" id="selectImagesBtn" disabled>
        <i class="bi bi-magic me-1"></i> 智能分配测试数据
    </button>
</div>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- 搜索和筛选 -->
    <div class="row mb-3">
        <div class="col-md-8">
            <div class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="搜索用例或任务...">
                <button class="btn btn-outline-secondary" type="button" id="searchBtn">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <select class="form-select" id="statusFilter">
                <option value="">所有状态</option>
                <option value="pending">待执行</option>
                <option value="executing">执行中</option>
                <option value="passed">通过</option>
                <option value="failed">失败</option>
            </select>
        </div>
    </div>

    <!-- 任务和用例列表 -->
    <div class="card">
        <div class="card-body">
            <div id="taskAccordion" class="accordion">
                <!-- 任务列表将在这里动态加载 -->
                <div class="text-center py-4" id="loadingIndicator">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <span class="ms-2">加载任务和测试用例...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 批量设置测试数据模态框 -->
<div class="modal fade" id="batchDataModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">批量设置测试数据</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="batchDataForm">
                    <div class="mb-3">
                        <label for="testDataPath" class="form-label">测试数据路径</label>
                        <input type="text" class="form-control" id="testDataPath" required>
                        <div class="form-text">请输入测试数据文件路径，例如：test_image.jpg</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmBatchData">确认设置</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑用例模态框 -->
<div class="modal fade" id="editCaseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑测试用例</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editCaseForm">
                    <input type="hidden" id="editCaseId">
                    <div class="mb-3">
                        <label for="editCaseName" class="form-label">用例名称</label>
                        <input type="text" class="form-control" id="editCaseName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editCasePurpose" class="form-label">测试目的</label>
                        <textarea class="form-control" id="editCasePurpose" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editCaseData" class="form-label">测试数据</label>
                        <input type="text" class="form-control" id="editCaseData">
                        <div class="form-text">输入测试数据文件路径</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveCase()">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let selectedCases = new Set();
    let testCases = [];
    let tasksData = [];
    let batchDataModal = null;
    let editCaseModal = null;
    
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化模态框
        batchDataModal = new bootstrap.Modal(document.getElementById('batchDataModal'));
        editCaseModal = new bootstrap.Modal(document.getElementById('editCaseModal'));
        
        // 加载任务和测试用例
        loadTasksWithTestCases();
        
        // 绑定搜索事件
        document.getElementById('searchBtn').addEventListener('click', filterTestCases);
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') filterTestCases();
        });
        
        // 绑定状态筛选事件
        document.getElementById('statusFilter').addEventListener('change', filterTestCases);
        
        // 绑定批量设置测试数据按钮事件
        document.getElementById('batchDataBtn').addEventListener('click', function() {
            if (selectedCases.size > 0) {
                batchDataModal.show();
            }
        });
        
        // 绑定确认批量设置事件
        document.getElementById('confirmBatchData')?.addEventListener('click', function() {
            const testDataPathInput = document.getElementById('testDataPath');
            if (!testDataPathInput) {
                console.error('测试数据路径输入框不存在');
                return;
            }
            
            const testDataPath = testDataPathInput.value.trim();
            if (!testDataPath) {
                showNotification('warning', '请输入测试数据路径');
                return;
            }
            
            if (batchDataModal) {
                batchDataModal.hide();
            }
            
            fetch('/api/testcases/batch-set-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    case_ids: Array.from(selectedCases),
                    test_data: testDataPath
                })
            })
            .then(response => response.json())
            .then(data => {
                showNotification('success', '测试数据设置成功');
                if (testDataPathInput) {
                    testDataPathInput.value = '';
                }
                loadTasksWithTestCases();
            })
            .catch(error => {
                console.error('设置测试数据失败:', error);
                showNotification('danger', `设置测试数据失败: ${error.message}`);
            });
        });
        
        // 绑定智能分配测试数据按钮事件
        document.getElementById('selectImagesBtn')?.addEventListener('click', function() {
            if (selectedCases.size === 0) {
                showNotification('warning', '请先选择测试用例');
                return;
            }
            
            // 获取选中测试用例对应的任务ID
            const selectedTaskIds = new Set();
            selectedCases.forEach(caseId => {
                const testCase = testCases.find(tc => tc.case_id === caseId);
                if (testCase && testCase.task_id) {
                    selectedTaskIds.add(testCase.task_id);
                }
            });
            
            if (selectedTaskIds.size === 0) {
                showNotification('warning', '无法确定选中测试用例的任务ID');
                return;
            }
            
            if (selectedTaskIds.size > 1) {
                showNotification('warning', '请选择同一个任务下的测试用例进行智能分配');
                return;
            }
            
            const taskId = Array.from(selectedTaskIds)[0];
            
            if (!confirm('确定要智能分配测试数据吗？这将根据任务的数据集自动为所有测试用例分配合适的图片。')) {
                return;
            }
            
            const btn = this;
            if (!btn) return;
            
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> 处理中...';
            
            showNotification('info', '正在分配测试数据，请稍候...');
            
            // 使用与任务详情页面相同的API接口
            fetch(`/api/tasks/${taskId}/select-images`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({})
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('智能分配测试数据结果:', data);
                
                if (data.success) {
                    // 成功分配测试数据
                    let examplesHtml = '';
                    if (data.image_examples && data.image_examples.length > 0) {
                        examplesHtml = '<ul class="mt-2 mb-0">' + 
                            data.image_examples.map(([caseId, imagePath]) => 
                                `<li><small>${caseId ? caseId.substring(0, 8) : '未知ID'}... => ${imagePath}</small></li>`
                            ).join('') + 
                        '</ul>';
                    }
                    
                    showNotification('success', `
                        <div>
                            <div><i class="bi bi-check-circle me-2"></i>成功为 ${data.updated_count} 个测试用例分配测试数据！</div>
                            ${examplesHtml}
                        </div>
                    `);
                    
                    // 刷新数据
                    loadTasksWithTestCases();
                } else {
                    // 分配失败
                    let errorsHtml = '';
                    if (data.errors && data.errors.length > 0) {
                        errorsHtml = '<ul class="mt-2 mb-0">' + 
                            data.errors.map(err => `<li><small>${err}</small></li>`).join('') + 
                        '</ul>';
                    }
                    
                    showNotification('danger', `
                        <div>
                            <div><i class="bi bi-exclamation-triangle me-2"></i>分配测试数据失败：${data.message}</div>
                            ${errorsHtml}
                        </div>
                    `);
                }
            })
            .catch(error => {
                console.error('分配测试数据失败:', error);
                showNotification('danger', `分配测试数据失败: ${error.message || '未知错误'}`);
            })
            .finally(() => {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
        });
    });
    
    function loadTasksWithTestCases() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.style.display = 'block';
        }
        
        fetch('/api/testcases/tasks')
            .then(response => response.json())
            .then(data => {
                tasksData = data.tasks || [];
                testCases = [];
                
                // 提取所有测试用例到平面数组
                tasksData.forEach(task => {
                    if (task.test_cases && task.test_cases.length > 0) {
                        task.test_cases.forEach(testCase => {
                            // 添加任务信息到测试用例
                            testCase.task_id = task.task_id;
                            testCases.push(testCase);
                        });
                    }
                });
                
                renderTasksWithTestCases(tasksData);
                
                // 更新批量处理按钮状态
                updateBatchButtons();
                
                if (loadingIndicator) {
                    loadingIndicator.style.display = 'none';
                }
            })
            .catch(error => {
                console.error('获取任务和测试用例失败:', error);
                showNotification('danger', `获取任务和测试用例失败: ${error.message}`);
                if (loadingIndicator) {
                    loadingIndicator.style.display = 'none';
                }
            });
    }
    
    function renderTasksWithTestCases(tasks) {
        const accordion = document.getElementById('taskAccordion');
        if (!accordion) {
            console.error('未找到taskAccordion元素');
            return;
        }
        
        accordion.innerHTML = '';
        
        if (!tasks || tasks.length === 0) {
            accordion.innerHTML = `
                <div class="text-center py-4">
                    <i class="bi bi-inbox text-muted"></i>
                    <span class="ms-2">暂无任务和测试用例</span>
                </div>
            `;
            return;
        }
        
        tasks.forEach((task, index) => {
            const hasTestCases = task.test_cases && task.test_cases.length > 0;
            const taskStatusClass = getTaskStatusBadgeClass(task.status);
            const taskStatusText = getTaskStatusText(task.status);
            
            const accordionItem = document.createElement('div');
            accordionItem.className = 'accordion-item';
            accordionItem.innerHTML = `
                <h2 class="accordion-header" id="heading${index}">
                    <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" 
                            type="button" 
                            data-bs-toggle="collapse" 
                            data-bs-target="#collapse${index}" 
                            aria-expanded="${index === 0 ? 'true' : 'false'}" 
                            aria-controls="collapse${index}">
                        <div class="d-flex align-items-center w-100">
                            <span class="badge bg-light text-dark me-2">
                                ${task.task_id ? task.task_id.substring(0, 8) : '未知ID'}
                            </span>
                            <span class="badge bg-${taskStatusClass} me-2">${taskStatusText}</span>
                            <span class="me-auto">测试用例数: ${task.test_cases_count || 0}</span>
                            <small class="text-muted ms-2">${formatDate(task.created_at)}</small>
                        </div>
                    </button>
                </h2>
                <div id="collapse${index}" 
                     class="accordion-collapse collapse ${index === 0 ? 'show' : ''}" 
                     aria-labelledby="heading${index}">
                    <div class="accordion-body">
                        ${hasTestCases ? `
                            <div class="form-check mb-3">
                                <input class="form-check-input task-select-all" 
                                       type="checkbox" 
                                       id="selectAllInTask${index}" 
                                       data-task-index="${index}">
                                <label class="form-check-label" for="selectAllInTask${index}">
                                    全选此任务下的测试用例
                                </label>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th width="40px">
                                                <div class="form-check">
                                                    <input class="form-check-input visually-hidden" type="checkbox" disabled>
                                                </div>
                                            </th>
                                            <th>ID</th>
                                            <th>名称</th>
                                            <th>测试目的</th>
                                            <th>测试数据</th>
                                            <th>状态</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${renderTaskTestCases(task.test_cases, index)}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle me-2"></i>
                                该任务下暂无测试用例
                            </div>
                        `}
                    </div>
                </div>
            `;
            
            accordion.appendChild(accordionItem);
        });
        
        // 绑定任务全选事件
        document.querySelectorAll('.task-select-all').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const taskIndex = this.dataset.taskIndex;
                const task = tasksData[taskIndex];
                const checkboxes = document.querySelectorAll(`.case-checkbox-task-${taskIndex}`);
                
                checkboxes.forEach(cb => {
                    cb.checked = this.checked;
                    toggleCaseSelection(cb.value, this.checked);
                });
                
                updateBatchButtons();
            });
        });
        
        // 绑定复选框事件
        document.querySelectorAll('.case-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                toggleCaseSelection(this.value, this.checked);
                updateBatchButtons();
                
                // 检查当前任务的全选状态
                const taskIndex = this.dataset.taskIndex;
                const checkboxes = document.querySelectorAll(`.case-checkbox-task-${taskIndex}`);
                const selectAllCheckbox = document.getElementById(`selectAllInTask${taskIndex}`);
                
                // 如果所有复选框都选中，则全选框也选中
                const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                selectAllCheckbox.checked = allChecked;
            });
        });
    }
    
    function renderTaskTestCases(cases, taskIndex) {
        if (!cases || cases.length === 0) {
            return `
                <tr>
                    <td colspan="7" class="text-center py-4">
                        <i class="bi bi-inbox text-muted"></i>
                        <span class="ms-2">暂无测试用例</span>
                    </td>
                </tr>
            `;
        }
        
        return cases.map(testCase => {
            const statusClass = {
                'pending': 'secondary',
                'executing': 'primary',
                'passed': 'success',
                'failed': 'danger'
            }[testCase.status] || 'secondary';
            
            return `
                <tr>
                    <td>
                        <div class="form-check">
                            <input class="form-check-input case-checkbox case-checkbox-task-${taskIndex}" 
                                   type="checkbox" 
                                   value="${testCase.case_id}"
                                   data-task-index="${taskIndex}"
                                   ${selectedCases.has(testCase.case_id) ? 'checked' : ''}>
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark">
                            ${testCase.case_id ? testCase.case_id.substring(0, 8) : '未知ID'}
                        </span>
                    </td>
                    <td>${testCase.name || '未命名测试用例'}</td>
                    <td>${testCase.purpose || '-'}</td>
                    <td>
                        <small class="text-muted">
                            ${testCase.test_data || '未设置'}
                        </small>
                    </td>
                    <td>
                        <span class="badge bg-${statusClass}">
                            ${getStatusText(testCase.status)}
                        </span>
                    </td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-primary" 
                                    onclick="editCase('${testCase.case_id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="btn btn-outline-danger" 
                                    onclick="deleteCase('${testCase.case_id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    function filterTestCases() {
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        
        if (!searchInput || !statusFilter) {
            console.error('搜索或状态过滤元素不存在');
            return;
        }
        
        const keyword = searchInput.value.trim().toLowerCase();
        const status = statusFilter.value;
        
        // 过滤测试用例
        const filteredTestCases = testCases.filter(testCase => {
            const matchesKeyword = !keyword || 
                (testCase.case_id && testCase.case_id.toLowerCase().includes(keyword)) ||
                (testCase.name && testCase.name.toLowerCase().includes(keyword)) ||
                (testCase.purpose && testCase.purpose.toLowerCase().includes(keyword));
                
            const matchesStatus = !status || testCase.status === status;
            
            return matchesKeyword && matchesStatus;
        });
        
        // 根据过滤后的测试用例获取任务ID
        const matchedTaskIds = new Set(filteredTestCases.map(tc => tc.task_id).filter(Boolean));
        
        // 只显示包含匹配测试用例的任务
        const filteredTasks = tasksData.map(task => {
            if (!task) return null;
            
            // 如果任务ID在匹配的集合中，则过滤该任务下的测试用例
            if (task.task_id && matchedTaskIds.has(task.task_id)) {
                return {
                    ...task,
                    test_cases: Array.isArray(task.test_cases) ? task.test_cases.filter(tc => {
                        if (!tc) return false;
                        
                        const matchesKeyword = !keyword || 
                            (tc.case_id && tc.case_id.toLowerCase().includes(keyword)) ||
                            (tc.name && tc.name.toLowerCase().includes(keyword)) ||
                            (tc.purpose && tc.purpose.toLowerCase().includes(keyword));
                            
                        const matchesStatus = !status || tc.status === status;
                        
                        return matchesKeyword && matchesStatus;
                    }) : []
                };
            }
            // 如果任务关键字匹配但没有测试用例匹配，则返回空测试用例列表
            else if (keyword && task.task_id && task.task_id.toLowerCase().includes(keyword)) {
                return {
                    ...task,
                    test_cases: []
                };
            }
            // 否则返回null表示不显示该任务
            return null;
        }).filter(Boolean); // 删除null值
        
        renderTasksWithTestCases(filteredTasks);
    }
    
    function toggleCaseSelection(caseId, isSelected) {
        if (isSelected) {
            selectedCases.add(caseId);
        } else {
            selectedCases.delete(caseId);
        }
    }
    
    function updateBatchButtons() {
        const batchDataBtn = document.getElementById('batchDataBtn');
        const selectImagesBtn = document.getElementById('selectImagesBtn');
        
        if (batchDataBtn) {
            batchDataBtn.disabled = selectedCases.size === 0;
        }
        
        if (selectImagesBtn) {
            selectImagesBtn.disabled = selectedCases.size === 0;
        }
    }
    
    function editCase(caseId) {
        const testCase = testCases.find(c => c.case_id === caseId);
        if (!testCase) return;
        
        const editCaseIdInput = document.getElementById('editCaseId');
        const editCaseNameInput = document.getElementById('editCaseName');
        const editCasePurposeInput = document.getElementById('editCasePurpose');
        const editCaseDataInput = document.getElementById('editCaseData');
        
        if (editCaseIdInput) editCaseIdInput.value = caseId;
        if (editCaseNameInput) editCaseNameInput.value = testCase.name || '';
        if (editCasePurposeInput) editCasePurposeInput.value = testCase.purpose || '';
        if (editCaseDataInput) editCaseDataInput.value = testCase.test_data || '';
        
        if (editCaseModal) {
            editCaseModal.show();
        }
    }
    
    function saveCase() {
        const editCaseIdInput = document.getElementById('editCaseId');
        const editCaseNameInput = document.getElementById('editCaseName');
        const editCasePurposeInput = document.getElementById('editCasePurpose');
        const editCaseDataInput = document.getElementById('editCaseData');
        
        if (!editCaseIdInput || !editCaseNameInput || !editCasePurposeInput || !editCaseDataInput) {
            console.error('编辑表单元素不存在');
            return;
        }
        
        const caseId = editCaseIdInput.value;
        const name = editCaseNameInput.value.trim();
        const purpose = editCasePurposeInput.value.trim();
        const testData = editCaseDataInput.value.trim();
        
        if (!name) {
            showNotification('warning', '请输入用例名称');
            return;
        }
        
        fetch(`/api/testcases/${caseId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: name,
                purpose: purpose,
                test_data: testData
            })
        })
        .then(response => response.json())
        .then(data => {
            editCaseModal.hide();
            showNotification('success', '测试用例已更新');
            loadTasksWithTestCases();
        })
        .catch(error => {
            console.error('更新测试用例失败:', error);
            showNotification('danger', `更新测试用例失败: ${error.message}`);
        });
    }
    
    function deleteCase(caseId) {
        if (!confirm('确定要删除这个测试用例吗？此操作不可恢复。')) return;
        
        fetch(`/api/testcases/${caseId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            showNotification('success', '测试用例已删除');
            loadTasksWithTestCases();
        })
        .catch(error => {
            console.error('删除测试用例失败:', error);
            showNotification('danger', `删除测试用例失败: ${error.message}`);
        });
    }
    
    function getStatusText(status) {
        const statusMap = {
            'pending': '待执行',
            'executing': '执行中',
            'passed': '通过',
            'failed': '失败'
        };
        return statusMap[status] || status;
    }
    
    function getTaskStatusText(status) {
        const statusMap = {
            'created': '已创建',
            'analyzing': '分析中',
            'preparing': '准备中',
            'executing': '执行中',
            'completed': '已完成',
            'failed': '失败'
        };
        return statusMap[status] || status;
    }
    
    function getTaskStatusBadgeClass(status) {
        const statusMap = {
            'created': 'secondary',
            'analyzing': 'info',
            'preparing': 'info',
            'executing': 'primary',
            'completed': 'success',
            'failed': 'danger'
        };
        return statusMap[status] || 'secondary';
    }
    
    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
    
    function showNotification(type, message) {
        if (!type || !message) {
            console.error('通知类型或消息不能为空');
            return;
        }
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
        alertDiv.style.zIndex = '9999';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        document.body?.appendChild(alertDiv);
        
        setTimeout(() => {
            if (alertDiv) {
                alertDiv.classList.remove('show');
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 300);
            }
        }, 3000);
    }
</script>
