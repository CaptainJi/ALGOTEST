<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误处理测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>错误处理测试</h1>
        <button id="testBtn" class="btn btn-primary">测试API错误处理</button>
        <div id="result" class="mt-3"></div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('testBtn').addEventListener('click', function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="alert alert-info">正在测试...</div>';
            
            // 测试API调用
            fetch('/api/tasks/TASK1748309508_0235a35d847e/prepare', {
                method: 'POST'
            })
            .then(handleAPIResponse)
            .then(data => {
                resultDiv.innerHTML = '<div class="alert alert-success">成功: ' + JSON.stringify(data) + '</div>';
            })
            .catch(error => {
                console.error('捕获到错误:', error);
                resultDiv.innerHTML = '<div class="alert alert-danger">错误: ' + error.message + '</div>';
            });
        });
    </script>
</body>
</html>
